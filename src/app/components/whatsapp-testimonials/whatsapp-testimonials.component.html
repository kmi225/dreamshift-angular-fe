<section class="wt" aria-labelledby="wt-heading">
  <div class="wt__shell">
    <div class="wt__stage">
      <div class="wt__cols">
        @for (col of columnConfigs; track $index) {
          <app-whatsapp-testimonials-scroll-column
            class="wt__col"
            [imageNumbers]="imageNumbersForColumn(col)"
            [direction]="col.direction"
            [startOffsetRatio]="col.startOffsetRatio"
            [speed]="col.speed ?? 0.3"
            (imageClick)="openGallery($event)"
          />
        }
      </div>

      <div class="wt__center" role="region" aria-label="WhatsApp testimonials summary">
        <h2 id="wt-heading" class="wt__heading">
          <span class="wt__heading-line">What our clients say</span>
        </h2>
        <p class="wt__lede">30+ WhatsApp conversations with our happy clients.</p>
        <button type="button" class="wt__cta" (click)="openGallery(1)">
          View full gallery <span class="wt__cta-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <div class="wt__fade wt__fade--top" aria-hidden="true"></div>
      <div class="wt__fade wt__fade--bottom" aria-hidden="true"></div>
    </div>
  </div>
</section>

<app-whatsapp-testimonials-gallery
  [currentImage]="galleryImage()"
  (currentImageChange)="galleryImage.set($event)"
/>
